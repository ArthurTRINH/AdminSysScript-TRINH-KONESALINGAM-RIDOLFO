# ==================================================
# J1 - fail2ban protege SSH (copie dans /etc/fail2ban/jail.d/ par installer.sh)
# Ce fichier est lu APRES defaults-debian.conf (ordre alphabetique) et le complete.
# ==================================================
[sshd]
enabled  = true
port     = ssh

# Debian 13 minimale n'a pas /var/log/auth.log : on lit le journal systemd.
backend  = systemd
# Avec OpenSSH 10, les messages d'authentification viennent du processus
# "sshd-session" et non plus "sshd" : on lit donc tout le service ssh.
journalmatch = _SYSTEMD_UNIT=ssh.service

# Detecte aussi les echecs sans mot de passe (cle refusee, groupe non autorise,
# utilisateur inconnu), indispensables quand PasswordAuthentication = no.
mode     = aggressive

# 3 echecs en 10 minutes -> bannissement 1 heure (valeurs a justifier dans DOSSIER.md)
maxretry = 3
findtime = 10m
bantime  = 1h

# Les bannissements sont poses dans nftables (table inet f2b-table)
banaction          = nftables[type=multiport]
banaction_allports = nftables[type=allports]
