#!/usr/sbin/nft -f
# ==================================================
# J2 - Pare-feu nftables - Chiffres & Co
# Copie dans /etc/nftables.conf par installer.sh, charge au demarrage par
# nftables.service (systemctl enable nftables) : la regle survit au redemarrage.
#
# Pas de "flush ruleset" : cela effacerait aussi la table de fail2ban
# (inet f2b-table) et donc les adresses bannies. On ne remplace que NOTRE table :
# la ligne "table inet filter" la cree si elle n'existe pas, puis on la supprime
# et on la recree. Le fichier est applique de facon atomique (tout ou rien).
#
# Pour recharger sans effacer fail2ban : systemctl reload nftables
# (PAS restart : l'arret du service Debian fait un "flush ruleset").
# ==================================================

table inet filter
delete table inet filter

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Reponses aux connexions deja etablies (dont nos mises a jour apt, DNS, DHCP)
        ct state established,related accept
        ct state invalid drop

        # Boucle locale
        iif "lo" accept

        # SSH : seul service joignable (D2)
        tcp dport 22 ct state new accept

        # Tout le reste est refuse par la politique "drop"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
