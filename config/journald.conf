# ==================================================
# J3 - Journal persistant - Chiffres & Co
# Installe en /etc/systemd/journald.conf.d/99-chiffres-co.conf par installer.sh
# (fichier complementaire : on ne remplace pas le journald.conf de Debian).
# ==================================================
[Journal]
# Journaux ecrits dans /var/log/journal (conserves apres redemarrage)
Storage=persistent
Compress=yes
# Limites de taille (disque principal d'environ 20 Go)
SystemMaxUse=500M
SystemKeepFree=1G
# Duree de conservation (valeur a justifier dans DOSSIER.md)
MaxRetentionSec=3month
