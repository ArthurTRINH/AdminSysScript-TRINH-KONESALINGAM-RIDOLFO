# Durcissement SSH (S1 a S5), installe dans /etc/ssh/sshd_config.d/ par installer.sh
# Le nom commence par 00- : sshd garde la premiere valeur lue, ce fichier passe donc avant les autres.

# S1 - Cle publique uniquement
PasswordAuthentication no
PubkeyAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# S2 - Connexion de root interdite
PermitRootLogin no

# S3 - Seuls les membres du groupe acces_ssh peuvent se connecter
AllowGroups acces_ssh

# S4 - 3 essais maximum par connexion
MaxAuthTries 3
LoginGraceTime 30

# S4 - Session inactive fermee au bout de 15 minutes
# (ClientAlive* ne ferme pas une session inactive : il detecte seulement un client disparu)
ClientAliveInterval 300
ClientAliveCountMax 2
ChannelTimeout session=15m
UnusedConnectionTimeout 1m

# Reduction de la surface d'attaque
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no

# Journalise l'empreinte de la cle utilisee
LogLevel VERBOSE
